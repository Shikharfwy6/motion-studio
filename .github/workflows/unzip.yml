name: Unzip project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and clean old files
        run: |
          rm -f src/main/java/com/motionstudio/app/MainActivity.kt
          unzip -o motion-studio-native.zip -x ".github/*"
          rm motion-studio-native.zip

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git commit -m "Unzip project" || echo "nothing to commit"
          git push
